[workspace]
members = ["verso", "versoview_messages", "versoview_build"]
resolver = "2"

[workspace.package]
version = "0.0.9"
edition = "2024"
license = "Apache-2.0 OR MIT"
homepage = "https://versotile.org/verso"
repository = "https://github.com/versotile-org/verso"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
ipc-channel = "0.23"
url = { version = "2.5.8", features = ["serde"] }
log = "0.4"
http = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dpi = { version = "0.1", features = ["serde"] }

[package]
name = "versoview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An innovative web browser"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.versotile.org/verso"
categories = ["web-programming"]

[package.metadata.packager]
name = "verso"
product-name = "verso"
identifier = "org.versotile.verso"
version = "0.0.1"
before-each-package-command = "python etc/package_libs.py"
resources = [
  "resources",
  "icons",
  "target/release/build/**/libEGL.dll",
  "target/release/build/**/libGLESv2.dll",
  "target/release/lib",
]
icons = ["icons/icon256x256.png", "icons/icon.ico"]

[package.metadata.packager.nsis]
appdata-paths = ["$LOCALAPPDATA/$IDENTIFIER"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin"]

[features]
# Resolve the resources of a `cargo packager` bundle.
packager = ["dep:cargo-packager-resource-resolver"]
# Resolve the resources of a Flatpak bundle, see org.versotile.verso.yml.
flatpak = []

[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
servo = { version = "0.7.0", features = ["default_web_features"] }
servo-webdriver-server = "0.7.0"
crossbeam-channel = "0.5"
versoview_messages = { path = "./versoview_messages" }
winit = { version = "0.30.13", features = ["rwh_06"] }
webrender_api = "0.70"
euclid = "0.22"
keyboard-types = "0.8.3"
url = { workspace = true }
http = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
getopts = "0.2.24"
ipc-channel = { workspace = true }
dpi = { workspace = true }
rfd = "0.17"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
thiserror = "2"
uuid.workspace = true
# Packager feature
cargo-packager-resource-resolver = { version = "0.1.1", features = [
  "auto-detect-format",
], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
notify-rust = "4.18.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.21"

[[test]]
name = "general"
