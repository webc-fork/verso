name: Check

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - uses: nixbuild/nix-quick-install-action@v30

      - name: "Add Nix channel"
        run: |
          nix-channel --add https://nixos.org/channels/nixos-24.11 nixpkgs
          nix-channel --update nixpkgs

      - name: Clippy
        run: nix-shell shell.nix --run 'rustup component add clippy && cargo clippy --workspace --all-targets -- -D warnings'

  check-windows:
    runs-on: windows-latest
    env:
      # aws-lc-sys fails to build with the latest MSVC, which needs C11 for its C atomics
      CFLAGS: /std:c11
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      # Mozangle needs Clang 19+
      # see https://github.com/tauri-apps/verso/actions/runs/15916377747/job/44894669786?pr=20
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"

      # Clippy is not part of the minimal toolchain profile in rust-toolchain.toml
      - name: Add clippy component
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  check-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: |
          curl https://gstreamer.freedesktop.org/data/pkg/osx/1.26.5/gstreamer-1.0-1.26.5-universal.pkg -o runtime.pkg
          sudo installer -pkg runtime.pkg -target /
          curl https://gstreamer.freedesktop.org/data/pkg/osx/1.26.5/gstreamer-1.0-devel-1.26.5-universal.pkg -o develop.pkg
          sudo installer -pkg develop.pkg -target /

      # Clippy is not part of the minimal toolchain profile in rust-toolchain.toml
      - name: Add clippy component
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
